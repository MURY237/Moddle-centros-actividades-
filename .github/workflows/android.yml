name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew test --stacktrace

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Leer la versión del proyecto
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          echo "numero=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # La app se actualiza sola leyendo la última release, así que cada versión
      # necesita su APK publicado ahí y descargable sin credenciales.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "actividades-moodle-$VERSION.apk"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "actividades-moodle-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "actividades-moodle-$VERSION.apk" \
              --title "v$VERSION" \
              --notes "$(git log -1 --pretty=%s)"
          fi
