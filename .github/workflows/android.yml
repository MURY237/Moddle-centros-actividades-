name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew test --stacktrace

      # El guion que lee NetAcad es JavaScript: se prueba en un DOM de verdad (jsdom), con
      # las versiones fijadas para que el resultado no cambie de un día para otro.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar el guion de NetAcad
        run: |
          mkdir -p "$RUNNER_TEMP/jsdom"
          npm install --prefix "$RUNNER_TEMP/jsdom" --no-save --no-audit --no-fund jsdom@30.1.1
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node app/src/test/js/extractor-netacad.test.js \
            app/src/main/java/com/asir/moodleactividades/data/netacad/ExtractorNetacad.kt
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node app/src/test/js/acceso-netacad.test.js \
            app/src/main/java/com/asir/moodleactividades/data/netacad/AutoAccesoNetacad.kt

      # Las reglas de seguridad de los grupos se prueban contra un PostgreSQL de verdad
      # (PGlite), con usuarios distintos intentando leer y escribir lo que no deben.
      - name: Probar las reglas de los grupos
        run: |
          mkdir -p "$RUNNER_TEMP/pglite"
          npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/pglite/node_modules" node supabase/pruebas/reglas.test.js supabase/esquema.sql

      # Firma propia, solo si están los secretos. Sin ellos se firma como siempre.
      - name: Preparar la firma propia
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_ALMACEN=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave propia."
          else
            echo "Sin secretos de firma: se usa la clave de depuración del repositorio."
          fi

      # La URL y la clave pública del servidor de grupos, si están como secretos del
      # repositorio. Sin ellos se compila igual y la pestaña explica qué falta.
      - name: Compilar APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CLAVE: ${{ secrets.SUPABASE_CLAVE }}
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Leer la versión del proyecto
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          echo "numero=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # La app se actualiza sola leyendo la última release, así que cada versión
      # necesita su APK publicado ahí y descargable sin credenciales.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "actividades-moodle-$VERSION.apk"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "actividades-moodle-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "actividades-moodle-$VERSION.apk" \
              --title "v$VERSION" \
              --notes "$(git log -1 --pretty=%s)"
          fi

      # Capturas de las pantallas, pintadas con Robolectric: la app solo se compila aquí, así
      # que es la forma de ver el diseño sin emulador. Van a la rama «capturas». Después de
      # publicar y sin cortar nada si fallan: son para revisar, no para bloquear.
      - name: Capturas de pantalla
        id: capturas
        continue-on-error: true
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true -Pcapturas=true --tests '*CapturasTest*' --stacktrace

      - name: Publicar capturas
        if: steps.capturas.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd app/build/capturas
          ls
          git init -q
          git checkout -q -b capturas
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

