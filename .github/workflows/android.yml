name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew test --stacktrace

      # El guion que lee NetAcad es JavaScript: se prueba en un DOM de verdad (jsdom), con
      # las versiones fijadas para que el resultado no cambie de un día para otro.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar los guiones de NetAcad y Séneca
        run: |
          mkdir -p "$RUNNER_TEMP/jsdom"
          npm install --prefix "$RUNNER_TEMP/jsdom" --no-save --no-audit --no-fund jsdom@30.1.1
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node app/src/test/js/extractor-netacad.test.js \
            app/src/main/java/com/asir/moodleactividades/data/netacad/ExtractorNetacad.kt
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node app/src/test/js/acceso-netacad.test.js \
            app/src/main/java/com/asir/moodleactividades/data/netacad/AutoAccesoNetacad.kt
          NODE_PATH="$RUNNER_TEMP/jsdom/node_modules" node app/src/test/js/acceso-seneca.test.js \
            app/src/main/java/com/asir/moodleactividades/data/seneca/AutoAcceso.kt

      # Las reglas de seguridad de los grupos se prueban contra un PostgreSQL de verdad
      # (PGlite), con usuarios distintos intentando leer y escribir lo que no deben.
      - name: Probar las reglas de los grupos
        run: |
          mkdir -p "$RUNNER_TEMP/pglite"
          npm install --prefix "$RUNNER_TEMP/pglite" --no-save --no-audit --no-fund @electric-sql/pglite@0.5.8
          NODE_PATH="$RUNNER_TEMP/pglite/node_modules" node supabase/pruebas/reglas.test.js supabase/esquema.sql

      # La función que manda los avisos al móvil, contra un servidor de mentira.
      - name: Probar la función de avisos
        run: node --experimental-strip-types supabase/pruebas/avisar.test.mjs supabase/functions/avisar/index.ts

      # Firma propia, solo si están los secretos. Sin ellos se firma como siempre.
      - name: Preparar la firma propia
        env:
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          if [ -n "$FIRMA_BASE64" ]; then
            echo "$FIRMA_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            echo "FIRMA_ALMACEN=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"
            echo "Se firma con la clave propia."
          else
            echo "Sin secretos de firma: se usa la clave de depuración del repositorio."
          fi

      # Si la clave propia no se puede abrir, dice por qué sin enseñar ningún secreto: solo
      # tamaños, si coinciden y la huella pública del certificado.
      - name: Diagnóstico de la firma propia
        if: ${{ env.FIRMA_ALMACEN != '' }}
        continue-on-error: true
        env:
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
          FIRMA_BASE64: ${{ secrets.FIRMA_BASE64 }}
        run: |
          echo "FIRMA_BASE64: ${#FIRMA_BASE64} caracteres"
          echo "almacén decodificado: $(stat -c%s "$FIRMA_ALMACEN") bytes, sha256 $(sha256sum "$FIRMA_ALMACEN" | cut -c1-16)"
          echo "contraseña del almacén: ${#FIRMA_CLAVE_ALMACEN} caracteres; de la clave: ${#FIRMA_CLAVE}; alias: ${#FIRMA_ALIAS}"
          if [ "$FIRMA_CLAVE_ALMACEN" = "$FIRMA_CLAVE" ]; then echo "las dos contraseñas coinciden"; else echo "las dos contraseñas NO coinciden"; fi
          case "$FIRMA_CLAVE_ALMACEN$FIRMA_CLAVE$FIRMA_ALIAS" in
            *[[:space:]]*) echo "HAY espacios o saltos de línea en algún secreto";;
            *) echo "ningún secreto tiene espacios";;
          esac
          keytool -list -keystore "$FIRMA_ALMACEN" -storepass "$FIRMA_CLAVE_ALMACEN" 2>&1 \
            | grep -E "SHA-256|incorrect|Invalid|error|PrivateKeyEntry" || true

      # Diagnóstico de los avisos al instante: solo informa, nunca corta la compilación.
      # No enseña ningún secreto, solo si están y qué responde el servidor.
      - name: Comprobar los avisos al instante
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CLAVE: ${{ secrets.SUPABASE_CLAVE }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: |
          if [ -z "$FIREBASE_JSON" ]; then
            echo "FIREBASE_JSON: no está"
          elif echo "$FIREBASE_JSON" | jq -e '.type == "service_account" or has("private_key")' >/dev/null 2>&1; then
            echo "FIREBASE_JSON: MAL. Tiene la clave privada de la cuenta de servicio; ahí va google-services.json"
          elif echo "$FIREBASE_JSON" | jq -e 'has("project_info") and has("client")' >/dev/null 2>&1; then
            echo "FIREBASE_JSON: sí, proyecto $(echo "$FIREBASE_JSON" | jq -r '.project_info.project_id'), apps: $(echo "$FIREBASE_JSON" | jq -r '[.client[].client_info.android_client_info.package_name] | join(", ")')"
          else
            echo "FIREBASE_JSON: está, pero no es un google-services.json"
          fi
          # La dirección y la clave pública también pueden ir en gradle.properties.
          [ -n "$SUPABASE_URL" ] || SUPABASE_URL=$(sed -n 's/^supabase\.url=//p' gradle.properties)
          [ -n "$SUPABASE_CLAVE" ] || SUPABASE_CLAVE=$(sed -n 's/^supabase\.clave=//p' gradle.properties)
          if [ -z "$SUPABASE_URL" ]; then echo "Sin dirección de Supabase: no se puede mirar el servidor"; exit 0; fi
          U="${SUPABASE_URL%/}"
          echo "Función avisar (404 = no desplegada; 401 = desplegada, pide sesión):"
          curl -s -m 20 -X POST "$U/functions/v1/avisar" -H "apikey: $SUPABASE_CLAVE" \
            -H "Content-Type: application/json" -d '{}' -w '  -> HTTP %{http_code}\n' || true
          echo "Tablas de avisos (42501 = esquema aplicado; PGRST202 = falta ejecutar esquema.sql):"
          curl -s -m 20 -X POST "$U/rest/v1/rpc/registrar_dispositivo" -H "apikey: $SUPABASE_CLAVE" \
            -H "Content-Type: application/json" -d '{"p_token":"diagnostico"}' -w '  -> HTTP %{http_code}\n' || true

      # La URL y la clave pública del servidor de grupos, si están como secretos del
      # repositorio. Sin ellos se compila igual y la pestaña explica qué falta.
      - name: Compilar APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CLAVE: ${{ secrets.SUPABASE_CLAVE }}
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: ./gradlew assembleDebug --stacktrace

      # Con clave propia, el APK se vuelve a firmar con la cadena «clave antigua → nueva»
      # para que Android actualice la app sin borrar los datos (ver el guion).
      - name: Firmar con la clave propia y la cadena de rotación
        if: ${{ env.FIRMA_ALMACEN != '' }}
        env:
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          .github/firmar-con-rotacion.sh "$APK" "$RUNNER_TEMP/firmado.apk" "$FIRMA_ALMACEN"
          mv "$RUNNER_TEMP/firmado.apk" "$APK"

      # Prueba del mecanismo con una clave desechable: así se sabe que funciona antes de
      # que lo use la clave de verdad, y que sigue funcionando en cada cambio.
      - name: Probar la firma con rotación (clave desechable)
        env:
          FIRMA_ALIAS: prueba
        run: |
          export FIRMA_CLAVE_ALMACEN=desechable-123456 FIRMA_CLAVE=desechable-123456
          keytool -genkeypair -keystore "$RUNNER_TEMP/prueba.jks" -storetype PKCS12 -alias prueba \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=prueba" \
            -storepass "$FIRMA_CLAVE_ALMACEN" -keypass "$FIRMA_CLAVE" 2>/dev/null
          .github/firmar-con-rotacion.sh app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/rotado.apk" "$RUNNER_TEMP/prueba.jks"

      - name: Leer la versión del proyecto
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | cut -d'"' -f2)
          echo "numero=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # La app se actualiza sola leyendo la última release, así que cada versión
      # necesita su APK publicado ahí y descargable sin credenciales.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "actividades-moodle-$VERSION.apk"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "actividades-moodle-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "actividades-moodle-$VERSION.apk" \
              --title "v$VERSION" \
              --notes "$(git log -1 --pretty=%s)"
          fi

      # Capturas de las pantallas, pintadas con Robolectric: la app solo se compila aquí, así
      # que es la forma de ver el diseño sin emulador. Van a la rama «capturas». Después de
      # publicar y sin cortar nada si fallan: son para revisar, no para bloquear.
      - name: Capturas de pantalla
        id: capturas
        continue-on-error: true
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true -Pcapturas=true --tests '*CapturasTest*' --stacktrace

      # Aunque falle alguna captura se publican las demás, con el informe de los tests para
      # ver cuál falló y por qué.
      - name: Publicar capturas
        if: always() && steps.capturas.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p app/build/capturas
          cp app/build/test-results/testDebugUnitTest/TEST-*CapturasTest.xml app/build/capturas/resultado.xml 2>/dev/null || true
          cd app/build/capturas
          ls
          git init -q
          git checkout -q -b capturas
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

